name: Relatar um problema
description: Informe um comportamento incorreto usando somente dados sanitizados.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo relato. Não inclua IPs, credenciais, código proprietário, configurações reais ou logs sem anonimização.
  - type: input
    id: version
    attributes:
      label: Versão da extensão
      placeholder: "Ex.: 1.0.0"
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: Versão do VS Code
      placeholder: "Ex.: 1.108.0"
    validations:
      required: true
  - type: input
    id: openedge
    attributes:
      label: Versão do OpenEdge
      placeholder: "Ex.: 12.2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options:
        - Editor, autocomplete ou navegação
        - Verificação de sintaxe
        - Execução
        - Bancos e Data Dictionary
        - Documentação ABL
        - Índice do workspace
        - Instalação ou atualização
        - Outra
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Use nomes fictícios e remova toda informação interna.
      placeholder: |
        1. Abra...
        2. Execute...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: sanitized_logs
    attributes:
      label: Logs sanitizados (opcional)
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmação de privacidade
      options:
        - label: Revisei o conteúdo e removi dados sensíveis, configurações reais e código proprietário.
          required: true
