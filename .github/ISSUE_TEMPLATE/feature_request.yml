name: Pedir uma funcionalidade
description: Proponha uma melhoria ou nova capacidade para o toolkit.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Descreva a necessidade sem incluir informações confidenciais da sua empresa.
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Qual dificuldade esta funcionalidade resolveria?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
      description: Como você imagina a experiência ideal?
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Benefício esperado
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas (opcional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmação de privacidade
      options:
        - label: A proposta não contém dados internos, credenciais, IPs ou código proprietário.
          required: true
